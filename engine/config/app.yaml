runtime:
  timezone: America/Chicago
  project_name: NOVA_LAPTOP_PY314
  provider: auto
  provider_fallback_order: [polygon, thetadata, yfinance, replay]
  max_workers: 4

universe:
  seed_file: config/universe_seed.txt
  min_market_cap: 250000000
  max_market_cap: 10000000000
  allowed_buckets: ["small", "mid"]
  max_symbols_per_scan: 100

contracts:
  right: call
  max_dte: 90
  min_dte: 7
  max_ask: 2.50
  min_ask: 0.10
  min_oi: 500
  max_spread_pct: 0.10
  elite_max_spread_pct: 0.06
  strike_sigma_min: -0.25
  strike_sigma_max: 1.25
  max_contracts_per_symbol: 6

scoring:
  weights:
    momentum: 0.15
    volatility_value: 0.10
    liquidity: 0.16
    positioning: 0.10
    short_pressure: 0.08
    insider: 0.03
    technical: 0.05
    dilution: 0.12
    sector: 0.07
    hidden_liquidity: 0.06
    synth_flow: 0.04
    spin: 0.04
  elite_score: 82
  min_score: 55
  min_score_lcb: 0.40
  min_sector_coherence: 0.20

risk:
  max_sector_exposure: 0.30
  max_position_risk_usd: 250
  stop_loss_pct: 0.18
  take_profit_pct: 0.45
  thesis_break_score: 50
  daily_loss_limit_pct: 0.05
  assumed_payoff_multiple: 1.5

storage:
  duckdb_path: data/nova_laptop.duckdb
  lake_root: data/lake
  retention_days_full_snapshots: 60
  retain_daily_symbol_summary: true

alerts:
  discord_enabled: true
  dedupe_hours: 4

edges:
  sec_dilution_lookback_days: 30
  finra_short_volume_enabled: true
  occ_open_interest_enabled: true
  insider_enabled: false
  ftd_enabled: true
  fred_macro_enabled: true

learner:
  enabled: true
  min_completed_trades: 30
  recent_window_days: 30

copilot:
  enabled: false
  use_ollama: false

paper:
  enabled: true
  max_open_positions: 8
  entry_slippage_bps: 15
  exit_slippage_bps: 20
  min_minutes_between_entries: 5

replay:
  fixtures_root: data/fixtures
  default_fixture: sample_option_scan.csv
  expanded_fixture: sample_option_scan_expanded.csv

memory:
  enabled: true
  store_path: data/memory/memory.jsonl
  top_k: 5

providers:
  polygon:
    enabled: true
    prefer_snapshot_mid: true
  thetadata:
    enabled: true
    strike_range: 12
  yfinance:
    enabled: true
  replay:
    enabled: true

calibration:
  enabled: true
  min_trades: 20
  output_path: data/calibration/latest_calibration.json
