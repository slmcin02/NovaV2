[project]
name = "nova-laptop-py314"
version = "0.2.1"
description = "Laptop-first calls-only options research, alerting, storage, learning, backtesting, replay, and paper-trading stack."
requires-python = ">=3.14"
dependencies = [
    "duckdb>=1.5.0",
    "pyarrow>=23.0.1",
    "pandas>=3.0.1",
    "numpy>=2.4.3",
    "requests>=2.32.5",
    "httpx>=0.28.1",
    "PyYAML>=6.0.3",
    "python-dotenv>=1.0",
    "yfinance>=1.2.0",
    "scikit-learn>=1.8.0",
    "joblib>=1.4",
    "websockets>=16.0",
    "rich>=13.9",
]

[project.scripts]
nova-cli = "nova.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["nova*"]

[tool.pytest.ini_options]
pythonpath = ["."]
